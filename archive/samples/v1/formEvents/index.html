<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Delegation - dom-primitive-bindings (v1)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-link-45deg text-warning me-2"></i>dom-primitive-bindings <span class="badge bg-primary">v1</span>
      </a>
      <span class="navbar-text text-light">Form Delegation Demo</span>
    </div>
  </nav>

  <main class="container py-2" style="max-width: 800px;">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-1 fw-bold text-dark">Form Container Event Delegation</h1>
            <p class="text-muted small mb-0">
              One listener on <code>#form-container</code> catches live changes, dropdown selections, and button clicks.
            </p>
          </div>
          <a href="../index.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>All Samples
          </a>
        </div>

        <form id="form-container" class="mt-4 p-3 bg-white border rounded">
          <div class="mb-3">
            <label class="form-label small fw-bold">Customer Name</label>
            <input type="text" name="customerName" class="form-control form-control-sm form-field" placeholder="Type your name...">
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Department</label>
            <select name="department" class="form-select form-select-sm form-field">
              <option value="">Select Department...</option>
              <option value="Engineering">Engineering</option>
              <option value="Procurement">Procurement</option>
              <option value="Accounts">Accounts</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Priority</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input form-field" type="radio" name="priority" value="Normal" id="p-normal" checked>
                <label class="form-check-label small" for="p-normal">Normal</label>
              </div>
              <div class="form-check">
                <input class="form-check-input form-field" type="radio" name="priority" value="Urgent" id="p-urgent">
                <label class="form-check-label small" for="p-urgent">Urgent</label>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="button" class="btn btn-primary btn-sm btn-form-action" data-action="save">
              <i class="bi bi-save me-1"></i> Save Draft
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm btn-form-action" data-action="clear">
              <i class="bi bi-x-circle me-1"></i> Clear Form
            </button>
          </div>
        </form>

        <div class="bg-dark text-info font-monospace small p-3 rounded mt-4" id="form-log">
          // Live field inputs and button clicks delegated to #form-container appear here...
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="../../../docs/dist/v1/min.js"></script>
  <script type="module" src="./index.js"></script>
</body>

</html>
